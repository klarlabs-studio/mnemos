# Publish the gate's verdict as the warden/gate commit status, so a push
# carries evidence that the checks ran on the machine that made it.
#
# warden is the authoritative gate (decided 2026-10-06, #382 Phase 4.1):
# branch protection requires warden/gate, published by this block, and
# nothing else. GitHub Actions still runs on every PR and push, but it is
# advisory: its runners stalled for hours during the consolidation, and a
# required check that cannot report blocks every merge.
#
# Advisory does not mean ignored. In August 2026, protection required
# warden/gate alone while pre-push ran fewer checks than CI, and main stayed
# red in Actions for three days with nothing noticing. Two things differ
# now: pre-push runs everything CI's gate does (test -race, lint, cross,
# govulncheck, and the pinned nox security scan), and a red Actions run on
# main is a defect to investigate. It usually means a check is missing here.
status:
  enabled: true

# warden gate — https://github.com/klarlabs-studio/warden
# Any dev with warden installed gets the same checks CI runs, pre-commit/pre-push.
hooks: { pre_commit: true, pre_push: true }
commands:
  # The gate that found the fleet-wide toolchain problem. It ran only in
  # GitHub Actions, and this repository no longer requires those checks —
  # so without this line, switching to warden/gate would delete it.
  vulns: "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."
  lint: "golangci-lint run --allow-parallel-runners ./..."
  test: "go test -race ./..."
  cross: "make cross"
  # The security gate. It ran only in the shared GitHub workflow; merges go
  # through warden, so without this line nothing scanned on the way to main —
  # which is how nine fixture DSNs reached main as net-new criticals unnoticed.
  security: "scripts/nox-gate.sh"
steps:
  pre_commit: [lint]
  pre_push: [test, lint, cross, vulns, security]
parallel: true
