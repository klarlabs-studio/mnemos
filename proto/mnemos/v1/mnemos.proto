syntax = "proto3";

package mnemos.v1;

option go_package = "go.klarlabs.de/mnemos/proto/gen/mnemos/v1;mnemosv1";

import "google/protobuf/timestamp.proto";

// MnemosService provides the gRPC API surface for the Mnemos knowledge
// registry. It mirrors the HTTP REST API at /v1/* with equivalent
// operations for episodes, beliefs, associations, embeddings, and metrics.
service MnemosService {
  // Health returns the service health status. Deep probes are available
  // via the detailed field.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListEpisodes returns a paginated list of all episodes, most recent first.
  rpc ListEpisodes(ListEpisodesRequest) returns (ListEpisodesResponse);

  // AppendEpisodes writes one or more episodes to the store. Idempotent on
  // duplicate episode IDs.
  rpc AppendEpisodes(AppendEpisodesRequest) returns (AppendResponse);

  // ListBeliefs returns a paginated list of beliefs with optional type/status
  // filtering. Evidence links are included when include_evidence is true.
  rpc ListBeliefs(ListBeliefsRequest) returns (ListBeliefsResponse);

  // AppendBeliefs writes beliefs and optionally their evidence links.
  rpc AppendBeliefs(AppendBeliefsRequest) returns (AppendResponse);

  // ListAssociations returns a paginated list of associations with
  // optional type filtering.
  rpc ListAssociations(ListAssociationsRequest) returns (ListAssociationsResponse);

  // AppendAssociations writes one or more association edges.
  rpc AppendAssociations(AppendAssociationsRequest) returns (AppendResponse);

  // ListEmbeddings returns a paginated list of embeddings with optional
  // entity_type filtering.
  rpc ListEmbeddings(ListEmbeddingsRequest) returns (ListEmbeddingsResponse);

  // AppendEmbeddings writes one or more embedding vectors.
  rpc AppendEmbeddings(AppendEmbeddingsRequest) returns (AppendResponse);

  // Metrics returns aggregate counts for the knowledge base.
  rpc Metrics(MetricsRequest) returns (MetricsResponse);

  // ---- Phase 2-7 entities ---------------------------------------------------

  // ListActions returns recorded operational actions.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  // AppendActions writes operational actions idempotently.
  rpc AppendActions(AppendActionsRequest) returns (AppendResponse);

  // ListOutcomes returns observed action outcomes.
  rpc ListOutcomes(ListOutcomesRequest) returns (ListOutcomesResponse);
  // AppendOutcomes writes outcomes idempotently. Auto-edges to the
  // parent action are NOT emitted server-side here; that wiring is
  // done by the higher-level CLI/MCP surface and stays out of the
  // raw write path.
  rpc AppendOutcomes(AppendOutcomesRequest) returns (AppendResponse);

  // ListSchemas returns synthesised schemas.
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
  // AppendSchemas writes schemas idempotently (UPSERT on id refreshes
  // confidence/last_verified, snapshots prior to schema_versions).
  rpc AppendSchemas(AppendSchemasRequest) returns (AppendResponse);

  // ListDecisions returns recorded decisions.
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse);
  // AppendDecisions writes decisions idempotently.
  rpc AppendDecisions(AppendDecisionsRequest) returns (AppendResponse);

  // ListReflexes returns synthesised or hand-authored reflexes.
  rpc ListReflexes(ListReflexesRequest) returns (ListReflexesResponse);
  // AppendReflexes writes reflexes idempotently.
  rpc AppendReflexes(AppendReflexesRequest) returns (AppendResponse);

  // ListGlobalSchemas returns the schemas promoted to the shared global tier
  // (ADR 0011/0012) — a different entity from ListSchemas, which returns this
  // tenant's schemas. The same records as REST GET /v1/schemas. status is
  // optional (pending | active); anything else is INVALID_ARGUMENT.
  rpc ListGlobalSchemas(ListGlobalSchemasRequest) returns (ListGlobalSchemasResponse);

  // --- Incidents (parity with REST /v1/incidents) ---
  // OpenIncident records an incident. Requires claims:write; a blank title or
  // unknown severity is INVALID_ARGUMENT.
  rpc OpenIncident(OpenIncidentRequest) returns (Incident);
  // ListIncidents returns incidents, optionally by severity and/or status.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  // GetIncident returns one incident; an unknown id is NOT_FOUND.
  rpc GetIncident(GetIncidentRequest) returns (Incident);
  // ResolveIncident marks an incident resolved. Requires claims:write; an
  // unknown id is NOT_FOUND and writes nothing.
  rpc ResolveIncident(ResolveIncidentRequest) returns (Incident);
  // WhyWereWeWrong is the post-incident analysis: the incident, its
  // root-cause belief's provenance and the decisions linked to it.
  rpc WhyWereWeWrong(WhyWereWeWrongRequest) returns (WhyWereWeWrongResponse);

  // ListEntityAssociations returns polymorphic cross-entity edges.
  rpc ListEntityAssociations(ListEntityAssociationsRequest) returns (ListEntityAssociationsResponse);
  // AppendEntityAssociations writes polymorphic edges idempotently.
  rpc AppendEntityAssociations(AppendEntityAssociationsRequest) returns (AppendResponse);

  // --- Connected brain (cognitive layer; parity with HTTP /v1/who-knows etc.) ---
  // WhoKnows ranks the workers whose memory best matches a query.
  rpc WhoKnows(WhoKnowsRequest) returns (WhoKnowsResponse);
  // KnowledgeGaps lists the store's highest-value open questions.
  rpc KnowledgeGaps(KnowledgeGapsRequest) returns (KnowledgeGapsResponse);
  // Calibration reports how well stated confidence tracks reality.
  rpc Calibration(CalibrationRequest) returns (CalibrationResponse);
  // Hypercorrections lists established beliefs a newer belief contradicts.
  rpc Hypercorrections(HypercorrectionsRequest) returns (HypercorrectionsResponse);
  // Recombinations lists topically-similar-but-unlinked belief pairs.
  rpc Recombinations(RecombinationsRequest) returns (RecombinationsResponse);
  // AnalogousBeliefs returns the beliefs most structurally analogous to one.
  rpc AnalogousBeliefs(AnalogousBeliefsRequest) returns (AnalogousBeliefsResponse);

  // --- Belief CRUD (cognitive layer; parity with HTTP GET /v1/claims/{id} etc.) ---
  // GetBelief returns a single belief's full detail.
  rpc GetBelief(GetBeliefRequest) returns (BeliefDetail);
  // SetBeliefLifecycle transitions a belief (candidate | promoted | superseded).
  rpc SetBeliefLifecycle(SetBeliefLifecycleRequest) returns (SetBeliefLifecycleResponse);
  // RetractEpisode withdraws an episode as evidence (ADR 0037): beliefs it
  // alone supported are retracted, beliefs with other live evidence are
  // rescored, and the impact is reported. The same operation as REST
  // POST /v1/episodes/{id}/retract and the retract_episode MCP tool. Requires
  // claims:write; an unknown episode, or one outside the token's runs, is
  // NOT_FOUND. Repeating it writes nothing and returns the stored record with
  // already_retracted set.
  rpc RetractEpisode(RetractEpisodeRequest) returns (RetractEpisodeResponse);
  // UnretractEpisode clears an episode's retraction (ADR 0037 §8): beliefs
  // the retraction deprecated return to their earlier status unless something
  // else changed them since (reported as skipped, with the reason), and
  // beliefs it rescored get the episode back as evidence. The same operation
  // as REST POST /v1/episodes/{id}/unretract and the unretract_episode MCP
  // tool. Requires claims:write; an unknown episode, or one outside the
  // token's runs, is NOT_FOUND; one that was never retracted is
  // FAILED_PRECONDITION. Repeating it writes nothing and returns the stored
  // record with already_unretracted set.
  rpc UnretractEpisode(UnretractEpisodeRequest) returns (UnretractEpisodeResponse);
  // ListEpisodeDependencies lists an episode's source dependencies (ADR
  // 0038): what it cites, copies or derives from, what depends on it, and its
  // citations that named no stored episode yet. include_removed also returns
  // dependencies removed by hand. The same read as REST GET
  // /v1/episodes/{id}/dependencies and the episode_dependencies MCP tool. An
  // unknown episode, or one outside the token's runs, is NOT_FOUND.
  rpc ListEpisodeDependencies(ListEpisodeDependenciesRequest) returns (ListEpisodeDependenciesResponse);
  // DeclareEpisodeDependency records by hand that an episode depends on
  // another and rescores the dependent episode's beliefs; it never retracts
  // anything (source_retracted reports the source's state). A removed
  // dependency is revived. The same operation as REST POST
  // /v1/episodes/{id}/dependencies and the declare_episode_dependency MCP
  // tool. Requires claims:write; an unknown episode is NOT_FOUND, a bad kind,
  // note or pair INVALID_ARGUMENT, a live dependency ALREADY_EXISTS.
  rpc DeclareEpisodeDependency(DeclareEpisodeDependencyRequest) returns (EpisodeDependencyChange);
  // RemoveEpisodeDependency marks a dependency removed, with an optional
  // reason (kept as a tombstone, so detection cannot re-add it; a revival
  // keeps it in the edit history) and rescores the dependent episode's
  // beliefs; it never un-retracts anything. The same operation as REST
  // DELETE /v1/episodes/{id}/dependencies/{depends_on} and the
  // remove_episode_dependency MCP tool. Requires claims:write; a pair with no
  // live dependency is NOT_FOUND, an over-long reason INVALID_ARGUMENT.
  rpc RemoveEpisodeDependency(RemoveEpisodeDependencyRequest) returns (EpisodeDependencyChange);
  // Classify reports whether a candidate statement fits established knowledge or is novel.
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);
  // GetDecision returns a single recorded decision by id.
  rpc GetDecision(GetDecisionRequest) returns (Decision);

  // --- Advanced recall (cognitive layer; parity with HTTP GET /v1/recall) ---
  // Recall runs advanced retrieval; mode selects the epistemic-honesty variant
  // (sufficiency | effort | context | conflicts | iterative).
  rpc Recall(RecallRequest) returns (RecallResponse);

  // --- Working memory + skill loop + temporal (cognitive layer) ---
  // GetBlocks returns an owner's working-memory blocks.
  rpc GetBlocks(GetBlocksRequest) returns (GetBlocksResponse);
  // SetBlock sets or appends a working-memory block.
  rpc SetBlock(SetBlockRequest) returns (SetBlockResponse);
  // Synthesize runs a synthesis pass (actions -> schemas + reflexes).
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  // Timeline returns episodes on the temporal timeline.
  rpc Timeline(TimelineRequest) returns (TimelineResponse);
  // Signals returns detected temporal patterns.
  rpc Signals(SignalsRequest) returns (SignalsResponse);

  // --- Ingest, search, passages, context, prediction and brain reads
  // (capability-registry parity with REST / MCP / the Go library) ---
  // ProcessText runs raw text through ingest -> extract -> relate -> persist,
  // the same pipeline as REST POST /v1/process and the process_text MCP tool.
  rpc ProcessText(ProcessTextRequest) returns (ProcessTextResponse);
  // Search is hybrid belief search with filters (REST /v1/search, MCP
  // query_knowledge): the same recall path through query.Engine.Recall.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Passages returns the stored episode passages that best match a query (BM25).
  rpc Passages(PassagesRequest) returns (PassagesResponse);
  // ContextBlock renders a run's agent-ready context block (REST /v1/context).
  rpc ContextBlock(ContextBlockRequest) returns (ContextBlockResponse);
  // PredictiveError reports hierarchical prediction error (ADR 0017).
  rpc PredictiveError(PredictiveErrorRequest) returns (PredictiveErrorResponse);
  // BrainHealth reports the unified brain-health verdict (ADR 0019).
  rpc BrainHealth(BrainHealthRequest) returns (BrainHealthResponse);
  // SetExpectation attaches (or replaces) a forward prediction on a belief.
  rpc SetExpectation(SetExpectationRequest) returns (Expectation);
  // GetExpectation reads a belief's expectation; NotFound when it has none.
  rpc GetExpectation(GetExpectationRequest) returns (Expectation);
  // RecordObservation records the observed value for a belief's expectation.
  rpc RecordObservation(RecordObservationRequest) returns (Expectation);
  // ReconcileExpectations closes every observed prediction into a
  // validates/refutes verdict.
  rpc ReconcileExpectations(ReconcileExpectationsRequest) returns (ReconcileExpectationsResponse);

  // --- Belief writes, governance and per-belief reads (one implementation
  // with REST, MCP and the Go library: internal/beliefops and the Memory
  // facade). An unknown belief is NOT_FOUND, a malformed request
  // INVALID_ARGUMENT. ---
  // RememberFact stores one fact as a belief, recording each evidence string
  // as an observation episode it links to (REST POST /v1/facts, MCP
  // remember's library twin). Requires claims:write; a run-scoped token is
  // PERMISSION_DENIED because the episodes carry no run.
  rpc RememberFact(RememberFactRequest) returns (RememberFactResponse);
  // ScanBeliefs returns beliefs valid within a time window, ordered by
  // valid_from (REST GET /v1/scan). A run-scoped token is PERMISSION_DENIED:
  // a scan spans every run.
  rpc ScanBeliefs(ScanBeliefsRequest) returns (ScanBeliefsResponse);
  // DeprecateBelief marks a belief deprecated (MCP memory_deprecate / forget,
  // REST POST /v1/beliefs/{id}/deprecate). Requires claims:write.
  rpc DeprecateBelief(DeprecateBeliefRequest) returns (BeliefStatusChange);
  // UpdateBelief rewrites a belief's text and optionally its confidence
  // (MCP update, REST POST /v1/beliefs/{id}/update). Requires claims:write.
  rpc UpdateBelief(UpdateBeliefRequest) returns (BeliefRevision);
  // ResolveDissonance settles two contradicting beliefs: winner resolved,
  // loser deprecated (MCP memory_resolve_dissonance, REST POST
  // /v1/beliefs/{id}/resolve). Requires claims:write.
  rpc ResolveDissonance(ResolveDissonanceRequest) returns (ResolveDissonanceResponse);
  // EscalateBelief asks for a human decision on a belief and returns the
  // escalation; it writes nothing (MCP memory_escalate, REST POST
  // /v1/beliefs/{id}/escalate). Requires claims:write.
  rpc EscalateBelief(EscalateBeliefRequest) returns (BeliefEscalation);
  // VerifyBelief re-verifies a belief against fresh evidence (MCP
  // memory_promote, REST POST /v1/beliefs/{id}/verify). Requires
  // promote:global.
  rpc VerifyBelief(VerifyBeliefRequest) returns (VerifyBeliefResponse);
  // RecordBeliefFeedback records a helpful/unhelpful vote (MCP
  // record_feedback, REST POST /v1/beliefs/{id}/feedback). Requires
  // claims:write.
  rpc RecordBeliefFeedback(RecordBeliefFeedbackRequest) returns (BeliefFeedback);
  // BeliefProvenance explains how a belief's trust was computed (REST GET
  // /v1/beliefs/{id}/provenance).
  rpc BeliefProvenance(BeliefProvenanceRequest) returns (.mnemos.v1.BeliefProvenance);
  // BeliefHistory returns a belief's version chain newest first (REST GET
  // /v1/beliefs/{id}/history).
  rpc BeliefHistory(BeliefHistoryRequest) returns (BeliefHistoryResponse);
}

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------

message Pagination {
  int32 limit  = 1;
  int32 offset = 2;
}

// ---------------------------------------------------------------------------
// Health
// ---------------------------------------------------------------------------

message HealthRequest {
  bool detailed = 1;
}

message HealthResponse {
  string status  = 1;
  string version = 2;
  bool   healthy = 3;
}

// ---------------------------------------------------------------------------
// Episodes
// ---------------------------------------------------------------------------

message Episode {
  string                 id             = 1;
  string                 run_id         = 2;
  string                 schema_version = 3;
  string                 content        = 4;
  string                 source_input_id = 5;
  google.protobuf.Timestamp timestamp   = 6;
  map<string, string>    metadata       = 7;
  google.protobuf.Timestamp ingested_at = 8;
}

message ListEpisodesRequest {
  Pagination pagination = 1;
}

message ListEpisodesResponse {
  repeated Episode episodes = 1;
  int32            total    = 2;
  int32            limit    = 3;
  int32            offset   = 4;
}

message AppendEpisodesRequest {
  repeated Episode episodes = 1;
}

// ---------------------------------------------------------------------------
// Beliefs
// ---------------------------------------------------------------------------

message Belief {
  string    id         = 1;
  string    text       = 2;
  string    type       = 3;
  double    confidence = 4;
  string    status     = 5;
  google.protobuf.Timestamp created_at = 6;
  // visibility gates audience access: personal | team | org.
  // Empty string is treated as "team" by the server.
  string    visibility = 7;
  // valid_from / valid_to bound when the belief's content is true. On
  // append, valid_to closes the belief, including one already stored; an
  // append that omits it never reopens a closed belief.
  google.protobuf.Timestamp valid_from = 8;
  google.protobuf.Timestamp valid_to   = 9;
  // half_life_days overrides the trust freshness constant for this belief:
  // a dated record stays trustworthy far longer than a passing remark.
  // Zero keeps the server default; negative is rejected.
  double    half_life_days = 10;
}

message BeliefEvidence {
  string belief_id  = 1;
  string episode_id = 2;
}

message ListBeliefsRequest {
  Pagination pagination        = 1;
  string     type_filter       = 2;
  string     status_filter     = 3;
  bool       include_evidence  = 4;
  // run_id: when set, only returns beliefs with ≥1 evidence link to an
  // episode whose RunID equals this value. Foundational tenant filter for
  // integrators that scope memory by run_id prefix (e.g. animal:<uuid>).
  // Beliefs with no evidence are excluded — fail closed.
  string     run_id            = 5;
  // as_of: validity-time filter. When set, only returns beliefs that
  // were valid at this timestamp (valid_from <= as_of AND (valid_to is
  // zero OR as_of < valid_to)). Mirrors the HTTP ?as_of= query param —
  // gRPC parity for Zep-style time-travel reads.
  google.protobuf.Timestamp as_of = 6;
  // recorded_as_of: ingestion-time filter. When set, drops beliefs
  // recorded after this timestamp so the response is reproducible
  // from the snapshot of the store as it stood then.
  google.protobuf.Timestamp recorded_as_of = 7;
}

message ListBeliefsResponse {
  repeated Belief         beliefs  = 1;
  repeated BeliefEvidence evidence = 2;
  int32                   total    = 3;
  int32                   limit    = 4;
  int32                   offset   = 5;
}

message AppendBeliefsRequest {
  repeated Belief         beliefs  = 1;
  repeated BeliefEvidence evidence = 2;
}

// ---------------------------------------------------------------------------
// Associations
// ---------------------------------------------------------------------------

message Association {
  string    id             = 1;
  string    type           = 2;
  string    from_belief_id = 3;
  string    to_belief_id   = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListAssociationsRequest {
  Pagination pagination  = 1;
  string     type_filter = 2;
}

message ListAssociationsResponse {
  repeated Association associations = 1;
  int32               total        = 2;
  int32               limit        = 3;
  int32               offset       = 4;
}

message AppendAssociationsRequest {
  repeated Association associations = 1;
}

// ---------------------------------------------------------------------------
// Embeddings
// ---------------------------------------------------------------------------

message Embedding {
  string    entity_id   = 1;
  string    entity_type = 2;
  repeated float vector = 3;
  string    model       = 4;
  int32     dimensions  = 5;
}

message ListEmbeddingsRequest {
  Pagination pagination  = 1;
  string     entity_type = 2; // "episode" or "belief"; empty = all
}

message ListEmbeddingsResponse {
  repeated Embedding embeddings = 1;
  int32              total      = 2;
  int32              limit      = 3;
  int32              offset     = 4;
}

message AppendEmbeddingsRequest {
  repeated Embedding embeddings = 1;
}

// ---------------------------------------------------------------------------
// Common response
// ---------------------------------------------------------------------------

message AppendResponse {
  int32 accepted = 1;
  int32 skipped  = 2;
  // Set by AppendBeliefs (ADR 0041). folded counts the new belief ids stored
  // as redirects to a belief the brain already held; remapped maps every
  // incoming belief id whose writes landed on another belief (a folded id or
  // a stored merge redirect) to that belief's id.
  int32 folded = 3;
  map<string, string> remapped = 4;
}

// ---------------------------------------------------------------------------
// Metrics
// ---------------------------------------------------------------------------

message MetricsRequest {}

message MetricsResponse {
  int64 runs              = 1;
  int64 episodes          = 2;
  int64 beliefs           = 3;
  int64 contested_beliefs = 4;
  int64 associations      = 5;
  int64 dissonances       = 6;
  int64 embeddings        = 7;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

message Action {
  string                     id            = 1;
  string                     run_id        = 2;
  string                     kind          = 3;
  string                     subject       = 4;
  string                     actor         = 5;
  google.protobuf.Timestamp  at            = 6;
  map<string, string>        metadata      = 7;
  string                     created_by    = 8;
  google.protobuf.Timestamp  created_at    = 9;
}

message ListActionsRequest {
  Pagination pagination = 1;
  string     subject    = 2; // optional filter; empty = all
  string     run_id     = 3; // optional filter; empty = all
}

message ListActionsResponse {
  repeated Action actions = 1;
  int32           total   = 2;
  int32           limit   = 3;
  int32           offset  = 4;
}

message AppendActionsRequest { repeated Action actions = 1; }

// ---------------------------------------------------------------------------
// Outcomes
// ---------------------------------------------------------------------------

message Outcome {
  string                    id          = 1;
  string                    action_id   = 2;
  string                    result      = 3; // success | failure | partial | unknown
  map<string, double>       metrics     = 4;
  string                    notes       = 5;
  google.protobuf.Timestamp observed_at = 6;
  string                    source      = 7; // "push" or "pull:<adapter>"
  string                    created_by  = 8;
  google.protobuf.Timestamp created_at  = 9;
}

message ListOutcomesRequest {
  Pagination pagination = 1;
  string     action_id  = 2; // optional filter
}

message ListOutcomesResponse {
  repeated Outcome outcomes = 1;
  int32            total    = 2;
  int32            limit    = 3;
  int32            offset   = 4;
}

message AppendOutcomesRequest { repeated Outcome outcomes = 1; }

// ---------------------------------------------------------------------------
// Schemas
// ---------------------------------------------------------------------------

message Context {
  string service = 1;
  string env     = 2;
  string team    = 3;
}

message Schema {
  string                    id             = 1;
  string                    statement      = 2;
  Context                   context        = 3;
  string                    trigger        = 4;
  string                    kind           = 5;
  repeated string           evidence       = 6;
  double                    confidence     = 7;
  google.protobuf.Timestamp derived_at     = 8;
  google.protobuf.Timestamp last_verified  = 9;
  string                    source         = 10;
  string                    created_by     = 11;
}

message ListSchemasRequest {
  Pagination pagination = 1;
  string     service    = 2; // optional context filter
  string     trigger    = 3; // optional trigger filter
}

message ListSchemasResponse {
  repeated Schema schemas = 1;
  int32           total   = 2;
  int32           limit   = 3;
  int32           offset  = 4;
}

message AppendSchemasRequest { repeated Schema schemas = 1; }

// ---------------------------------------------------------------------------
// Decisions
// ---------------------------------------------------------------------------

message Decision {
  string                    id           = 1;
  string                    statement    = 2;
  string                    plan         = 3;
  string                    reasoning    = 4;
  string                    risk_level   = 5;
  repeated string           beliefs      = 6;
  repeated string           alternatives = 7;
  string                    outcome_id   = 8;
  Context                   context      = 9;
  google.protobuf.Timestamp chosen_at    = 10;
  string                    created_by   = 11;
  google.protobuf.Timestamp created_at   = 12;
}

message ListDecisionsRequest {
  Pagination pagination = 1;
  string     risk_level = 2; // optional filter
}

message ListDecisionsResponse {
  repeated Decision decisions = 1;
  int32             total     = 2;
  int32             limit     = 3;
  int32             offset    = 4;
}

message AppendDecisionsRequest { repeated Decision decisions = 1; }

// ---------------------------------------------------------------------------
// Reflexes
// ---------------------------------------------------------------------------

message ReflexStep {
  int32  order       = 1;
  string action      = 2;
  string description = 3;
  string condition   = 4;
}

message Reflex {
  string                    id                   = 1;
  string                    trigger              = 2;
  string                    statement            = 3;
  Context                   context              = 4;
  repeated ReflexStep       steps                = 5;
  repeated string           derived_from_schemas = 6;
  double                    confidence           = 7;
  google.protobuf.Timestamp derived_at           = 8;
  google.protobuf.Timestamp last_verified        = 9;
  string                    source               = 10;
  string                    created_by           = 11;
}

message ListReflexesRequest {
  Pagination pagination = 1;
  string     trigger    = 2; // optional filter
  string     service    = 3; // optional context filter
}

message ListReflexesResponse {
  repeated Reflex reflexes = 1;
  int32           total    = 2;
  int32           limit    = 3;
  int32           offset   = 4;
}

message AppendReflexesRequest { repeated Reflex reflexes = 1; }

// ---------------------------------------------------------------------------
// Global (promoted) schemas
// ---------------------------------------------------------------------------

// GlobalSchema is a de-identified generalisation promoted to the shared
// global tier. Its provenance is corroboration counts, never tenant ids.
message GlobalSchema {
  string                    id               = 1;
  string                    statement        = 2;
  Context                   context          = 3;
  string                    polarity         = 4;
  int32                     distinct_tenants = 5;
  int32                     evidence_count   = 6;
  double                    confidence       = 7;
  double                    surprise         = 8;
  bool                      has_surprise     = 9;
  string                    status           = 10;
  google.protobuf.Timestamp promoted_at      = 11;
  string                    created_by       = 12;
}

message ListGlobalSchemasRequest {
  Pagination pagination = 1;
  string     status     = 2; // optional: pending | active
}

message ListGlobalSchemasResponse {
  repeated GlobalSchema global_schemas = 1;
  int32                 total          = 2;
  int32                 limit          = 3;
  int32                 offset         = 4;
}

// ---------------------------------------------------------------------------
// Incidents
// ---------------------------------------------------------------------------

message Incident {
  string                    id                   = 1;
  string                    title                = 2;
  string                    summary              = 3;
  string                    severity             = 4; // critical | high | medium | low
  string                    status               = 5; // open | resolved | postmortem
  string                    root_cause_belief_id = 6;
  repeated string           decision_ids         = 7;
  repeated string           outcome_ids          = 8;
  repeated string           timeline_episode_ids = 9;
  string                    reflex_id            = 10;
  google.protobuf.Timestamp opened_at            = 11;
  google.protobuf.Timestamp resolved_at          = 12;
  string                    created_by           = 13;
}

message OpenIncidentRequest {
  string          id                   = 1; // optional; generated when empty
  string          title                = 2;
  string          summary              = 3;
  string          severity             = 4; // default medium
  string          root_cause_belief_id = 5;
  repeated string decision_ids         = 6;
  repeated string outcome_ids          = 7;
  repeated string timeline_episode_ids = 8;
}

message ListIncidentsRequest {
  Pagination pagination = 1;
  string     severity   = 2; // optional
  string     status     = 3; // optional
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
  int32             total     = 2;
  int32             limit     = 3;
  int32             offset    = 4;
}

message GetIncidentRequest { string id = 1; }
message ResolveIncidentRequest { string id = 1; }
message WhyWereWeWrongRequest { string incident_id = 1; }

message ProvenanceSignal {
  string name         = 1;
  double value        = 2;
  double weight       = 3;
  double contribution = 4;
  string detail       = 5;
}

// BeliefProvenance is a belief's credibility breakdown.
message BeliefProvenance {
  string                    belief_id       = 1;
  string                    text            = 2;
  double                    score           = 3;
  repeated ProvenanceSignal signals         = 4;
  string                    rationale       = 5;
  string                    prose_rationale = 6;
  string                    source_document = 7;
  string                    liveness        = 8;
}

message WhyWereWeWrongResponse {
  Incident          incident           = 1;
  BeliefProvenance  root_belief        = 2; // unset when the incident names none or it is not stored
  repeated Decision affected_decisions = 3;
  string            explanation        = 4;
}

// ---------------------------------------------------------------------------
// EntityAssociations
// ---------------------------------------------------------------------------

message EntityAssociation {
  string                    id         = 1;
  string                    kind       = 2;
  string                    from_id    = 3;
  string                    from_type  = 4;
  string                    to_id      = 5;
  string                    to_type    = 6;
  google.protobuf.Timestamp created_at = 7;
  string                    created_by = 8;
}

message ListEntityAssociationsRequest {
  Pagination pagination  = 1;
  string     kind        = 2; // optional filter
  string     entity_id   = 3; // optional: list edges touching this entity
  string     entity_type = 4; // required when entity_id is set
}

message ListEntityAssociationsResponse {
  repeated EntityAssociation edges  = 1;
  int32                      total  = 2;
  int32                      limit  = 3;
  int32                      offset = 4;
}

message AppendEntityAssociationsRequest { repeated EntityAssociation edges = 1; }

// ---------------------------------------------------------------------------
// Connected brain (cognitive layer)
// ---------------------------------------------------------------------------

message WhoKnowsRequest {
  string query = 1;
  int32  limit = 2;
}
message Expert {
  string worker       = 1;
  double affinity     = 2;
  double reliability  = 3;
  int32  belief_count = 4;
}
message WhoKnowsResponse {
  string          query   = 1;
  repeated Expert experts = 2;
}

message KnowledgeGapsRequest { int32 limit = 1; }
message Gap {
  string belief_id = 1;
  string text      = 2;
  string kind      = 3;
  double score     = 4;
}
message KnowledgeGapsResponse { repeated Gap gaps = 1; }

message CalibrationRequest {}
message CalibrationBucket {
  double lower           = 1;
  double upper           = 2;
  int32  count           = 3;
  double mean_confidence = 4;
  double accuracy        = 5;
}
message CalibrationSource {
  string source          = 1;
  int32  samples         = 2;
  double mean_confidence = 3;
  double accuracy        = 4;
  double gap             = 5;
  double brier           = 6;
}
message CalibrationResponse {
  int32                      samples = 1;
  double                     ece     = 2;
  double                     brier   = 3;
  repeated CalibrationBucket buckets = 4;
  repeated CalibrationSource sources = 5;
}

message HypercorrectionsRequest {}
message Hypercorrection {
  string                    contradicted_belief_id = 1;
  string                    contradicted_text      = 2;
  double                    contradicted_trust     = 3;
  bool                      contradicted_promoted  = 4;
  string                    challenging_belief_id  = 5;
  string                    challenging_text       = 6;
  google.protobuf.Timestamp detected_at            = 7;
}
message HypercorrectionsResponse { repeated Hypercorrection hypercorrections = 1; }

message RecombinationsRequest { int32 limit = 1; }
message Recombination {
  string belief_a   = 1;
  string text_a     = 2;
  string belief_b   = 3;
  string text_b     = 4;
  double similarity = 5;
}
message RecombinationsResponse { repeated Recombination recombinations = 1; }

message AnalogousBeliefsRequest {
  string belief_id = 1;
  int32  limit     = 2;
}
message Analogy {
  string belief_id  = 1;
  string text       = 2;
  double similarity = 3;
}
message AnalogousBeliefsResponse {
  string           belief_id = 1;
  repeated Analogy analogous = 2;
}

// ---------------------------------------------------------------------------
// Belief CRUD (cognitive layer)
// ---------------------------------------------------------------------------

message GetBeliefRequest { string belief_id = 1; }
message BeliefDetail {
  string                    id          = 1;
  string                    statement   = 2;
  string                    type        = 3;
  double                    confidence  = 4;
  double                    trust_score = 5;
  string                    lifecycle   = 6;
  google.protobuf.Timestamp valid_from  = 7;
  google.protobuf.Timestamp valid_until = 8;
  google.protobuf.Timestamp recorded_at = 9;
}

message SetBeliefLifecycleRequest {
  string belief_id = 1;
  string lifecycle = 2; // candidate | promoted | superseded
}
message SetBeliefLifecycleResponse {
  string belief_id = 1;
  string lifecycle = 2;
}

message RetractEpisodeRequest {
  string episode_id = 1;
  string reason     = 2; // optional; recorded with the retraction
}
message RetractEpisodeResponse {
  string episode_id                      = 1;
  google.protobuf.Timestamp retracted_at = 2;
  string retracted_by                    = 3;
  string reason                          = 4;
  bool already_retracted                 = 5;
  RetractionImpact impact                = 6;
}
// RetractionImpact lists what a retraction changed and what MAY be affected;
// it never asserts that a downstream decision or belief was wrong.
message RetractionImpact {
  repeated string retracted_beliefs           = 1;
  repeated string already_deprecated          = 2;
  repeated RescoredBelief rescored_beliefs    = 3;
  repeated string associations                = 4;
  repeated RetractionDecisionExposure decisions = 5;
  repeated string outcome_edges               = 6;
  repeated string uncertainty                 = 7;
  // ADR 0038: episodes that depend on the retracted one (not retracted
  // themselves), and the episode chain that reached each belief.
  repeated EpisodeDependencyHop dependent_episodes = 8;
  repeated RetractionBeliefPath belief_paths       = 9;
}
// EpisodeDependencyHop is one recorded dependency: episode_id cites, copies or
// derives from depends_on, found by signal, justified by reference.
message EpisodeDependencyHop {
  string episode_id = 1;
  string depends_on = 2;
  string kind       = 3; // cites | copies | derived_from
  string signal     = 4; // metadata | link | named_source
  string reference  = 5;
}
// RetractionBeliefPath says how a retraction reached a belief.
message RetractionBeliefPath {
  string belief_id    = 1;
  string outcome      = 2; // retracted | rescored | kept
  repeated string via = 3; // episode chain from the retracted episode
}
message RescoredBelief {
  string id              = 1;
  double trust_before    = 2;
  double trust_after     = 3;
  int32 remaining_evidence = 4;
}
message RetractionDecisionExposure {
  string decision_id      = 1;
  repeated string beliefs = 2;
}

message UnretractEpisodeRequest {
  string episode_id = 1;
  string reason     = 2; // optional; recorded with the un-retraction
}
message UnretractEpisodeResponse {
  string episode_id                        = 1;
  google.protobuf.Timestamp unretracted_at = 2;
  string unretracted_by                    = 3;
  string reason                            = 4;
  int32 generation                         = 5; // generation of the cleared retraction
  google.protobuf.Timestamp retracted_at   = 6; // of the cleared retraction
  string retracted_by                      = 7;
  bool already_unretracted                 = 8;
  UnretractionImpact impact                = 9;
}
// UnretractionImpact is what an un-retraction changed, and what it left alone
// and why.
message UnretractionImpact {
  repeated RestoredBelief restored_beliefs = 1;
  repeated SkippedBelief skipped_beliefs   = 2;
  repeated RelinkedBelief relinked_beliefs = 3;
  repeated string uncertainty              = 4;
}
message RestoredBelief {
  string id     = 1;
  string status = 2;
}
message SkippedBelief {
  string id     = 1;
  string reason = 2;
}
message RelinkedBelief {
  string id           = 1;
  string status       = 2;
  double trust_before = 3;
  double trust_after  = 4;
}

// EpisodeDependency is one source dependency (ADR 0038): episode_id cites,
// copies or derives from depends_on. signal is metadata, link, named_source or
// declared; removed_at is set on one removed by hand, with removal_reason. A
// listing with include_removed has one entry per interval of a pair.
message EpisodeDependency {
  string episode_id                    = 1;
  string depends_on                    = 2;
  string kind                          = 3;
  string signal                        = 4;
  string reference                     = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by                    = 7;
  google.protobuf.Timestamp removed_at = 8;
  string removed_by                    = 9;
  string removal_reason                = 10; // why it was removed, if given
}
message PendingCitation {
  string lookup_key                    = 1;
  google.protobuf.Timestamp created_at = 2;
}
message ListEpisodeDependenciesRequest {
  string episode_id    = 1;
  bool include_removed = 2;
}
message ListEpisodeDependenciesResponse {
  string episode_id                      = 1;
  repeated EpisodeDependency depends_on  = 2;
  repeated EpisodeDependency dependents  = 3;
  repeated PendingCitation pending_citations = 4;
}
message DeclareEpisodeDependencyRequest {
  string episode_id = 1;
  string depends_on = 2;
  string kind       = 3; // cites | copies | derived_from
  string note       = 4; // optional, at most 512 characters
}
message RemoveEpisodeDependencyRequest {
  string episode_id = 1;
  string depends_on = 2;
  string reason     = 3; // optional, at most 512 characters
}
// EpisodeDependencyChange is what a declaration or removal did.
message EpisodeDependencyChange {
  EpisodeDependency dependency      = 1;
  repeated string rescored_beliefs  = 2;
  bool source_retracted             = 3;
}

message ClassifyRequest { string text = 1; }
message ClassifyResponse {
  string kind        = 1; // AssimilationFits | AssimilationNovel
  string anchor_id   = 2;
  string anchor_text = 3;
  double confidence  = 4;
}

message GetDecisionRequest { string id = 1; }

// ---------------------------------------------------------------------------
// Advanced recall (cognitive layer)
// ---------------------------------------------------------------------------

message RecallRequest {
  string query      = 1;
  string run_id     = 2;
  int32  limit      = 3;
  int32  hops       = 4;
  string mode       = 5; // sufficiency | effort | context | conflicts | iterative
  double stakes     = 6; // effort mode
  string context    = 7; // context mode
  int32  max_rounds = 8; // iterative mode
}
message RecallResult {
  string belief_id    = 1;
  string text         = 2;
  string type         = 3;
  double confidence   = 4;
  double trust_score  = 5;
  int32  hop_distance = 6;
  string provenance   = 7;
}
message RecallSufficiency {
  double confidence   = 1;
  int32  belief_count = 2;
  bool   sufficient   = 3;
  double floor        = 4;
}
message RecallEffort {
  double budget  = 1;
  int32  passes  = 2;
  int32  hops    = 3;
  int32  breadth = 4;
}
message RecallConflict {
  string belief_id           = 1;
  string belief_text         = 2;
  string contradicting_id    = 3;
  string contradicting_text  = 4;
  double contradicting_trust = 5;
}
message RecallResponse {
  string                  mode        = 1;
  repeated RecallResult   results     = 2;
  RecallSufficiency       sufficiency = 3; // sufficiency + effort modes
  RecallEffort            effort      = 4; // effort mode
  repeated RecallConflict conflicts   = 5; // conflicts mode
  int32                   rounds      = 6; // iterative mode
}

// ---------------------------------------------------------------------------
// Working memory + skill loop + temporal (cognitive layer)
// ---------------------------------------------------------------------------

message MemoryBlock {
  string                    owner      = 1;
  string                    label      = 2;
  string                    value      = 3;
  google.protobuf.Timestamp updated_at = 4;
}
message GetBlocksRequest { string owner = 1; }
message GetBlocksResponse {
  string               owner  = 1;
  repeated MemoryBlock blocks = 2;
}
message SetBlockRequest {
  string owner  = 1;
  string label  = 2;
  string value  = 3;
  bool   append = 4; // true -> AppendBlock, else SetBlock
}
message SetBlockResponse {
  string owner = 1;
  string label = 2;
}

message SynthesizeRequest {}
message SynthesizeResponse {
  int32 schemas_derived = 1;
  int32 reflexes_derived = 2;
}

message TimelineEpisode {
  string                    id       = 1;
  google.protobuf.Timestamp at       = 2;
  string                    type     = 3;
  string                    content  = 4;
  string                    run_id   = 5;
  map<string, string>       metadata = 6;
}
message TimelineRequest {
  string                    run_id = 1;
  google.protobuf.Timestamp from   = 2;
  google.protobuf.Timestamp to     = 3;
  repeated string           types  = 4;
  int32                     limit  = 5;
}
message TimelineResponse { repeated TimelineEpisode episodes = 1; }

message MemorySignal {
  string                    pattern      = 1;
  string                    run_id       = 2;
  double                    strength     = 3;
  double                    confidence   = 4;
  string                    signal_class = 5;
  google.protobuf.Timestamp detected_at  = 6;
  google.protobuf.Timestamp window_start = 7;
  google.protobuf.Timestamp window_end   = 8;
}
message SignalsRequest {
  string run_id         = 1;
  double min_confidence = 2;
  int32  limit          = 3;
}
message SignalsResponse { repeated MemorySignal signals = 1; }

// ---------------------------------------------------------------------------
// Ingest, search, passages, context, prediction and brain reads
// ---------------------------------------------------------------------------

message ProcessTextRequest {
  string text = 1;
  // use_llm / use_embeddings are tri-state: unset lets the server decide
  // (LLM extraction iff it has a provider configured), as on REST.
  optional bool use_llm        = 2;
  optional bool use_embeddings = 3;
}
message ProcessTextResponse {
  string run_id          = 1;
  int32  episodes        = 2;
  int32  beliefs         = 3;
  int32  associations    = 4;
  int32  embeddings      = 5;
  bool   used_llm        = 6;
  bool   used_embeddings = 7;
}

message SearchRequest {
  string                    query          = 1;
  string                    run_id         = 2;
  int32                     top_k          = 3;
  double                    min_trust      = 4;
  google.protobuf.Timestamp as_of          = 5; // validity time
  google.protobuf.Timestamp recorded_as_of = 6; // ingestion time (ADR 0036)
  Context                   scope          = 7;
  string                    type_filter    = 8;
  string                    status_filter  = 9;
  string                    consumer       = 10; // user (default) | agent
  string                    visibility     = 11; // personal | team | org
}
message SearchBelief {
  string id          = 1;
  string text        = 2;
  string type        = 3;
  string status      = 4;
  double confidence  = 5;
  double trust_score = 6;
}
message SearchVerdict {
  string winner_belief_id  = 1;
  string loser_belief_id   = 2;
  double confidence        = 3;
  string rationale         = 4;
  string action            = 5;
  string escalation_reason = 6;
}
message SearchResponse {
  string                 query                     = 1;
  repeated SearchBelief  beliefs                   = 2;
  repeated Association   dissonances               = 3;
  int32                  total                     = 4;
  int32                  top_k                     = 5;
  bool                   auto_resolved             = 6;
  string                 dissonance_explanation    = 7;
  repeated SearchVerdict verdicts                  = 8;
}

message PassagesRequest {
  string query  = 1;
  int32  limit  = 2;
  string run_id = 3;
}
message Passage {
  string                    episode_id = 1;
  string                    text       = 2;
  google.protobuf.Timestamp at         = 3;
  map<string, string>       metadata   = 4;
  double                    score      = 5;
}
message PassagesResponse { repeated Passage passages = 1; }

message ContextBlockRequest {
  string run_id     = 1;
  string query      = 2;
  int32  max_tokens = 3;
}
message ContextBlockResponse {
  string run_id  = 1;
  string context = 2;
}

message PredictiveErrorRequest {}
message PredictiveErrorLevel {
  string level   = 1;
  double error   = 2;
  int32  samples = 3;
  string basis   = 4;
}
message PredictiveErrorResponse {
  repeated PredictiveErrorLevel levels          = 1;
  double                        total           = 2;
  string                        hotspot         = 3;
  int32                         levels_measured = 4;
}

message BrainHealthRequest {
  // full forces the exact scan; the default samples large brains.
  bool full = 1;
}
message Vital {
  string name   = 1;
  double value  = 2;
  string status = 3;
  string detail = 4;
}
message Pathology {
  string kind   = 1;
  int32  count  = 2;
  string status = 3;
  string detail = 4;
}
message VitalEstimate {
  int32  sample_size = 1;
  int32  population  = 2;
  double margin_95   = 3;
}
message BrainHealthResponse {
  string                     status      = 1;
  repeated Vital             vitals      = 2;
  repeated Pathology         pathologies = 3;
  string                     mode        = 4;
  map<string, VitalEstimate> estimates   = 5;
  google.protobuf.Timestamp  at          = 6;
}

message Expectation {
  string                    belief_id       = 1;
  double                    predicted       = 2;
  double                    tolerance       = 3;
  google.protobuf.Timestamp horizon         = 4;
  double                    observed        = 5;
  bool                      has_observation = 6;
  bool                      resolved        = 7;
  google.protobuf.Timestamp created_at      = 8;
}
message SetExpectationRequest {
  string                    belief_id = 1;
  double                    predicted = 2;
  double                    tolerance = 3;
  google.protobuf.Timestamp horizon   = 4;
}
message GetExpectationRequest { string belief_id = 1; }
message RecordObservationRequest {
  string belief_id = 1;
  double observed  = 2;
}
message ReconcileExpectationsRequest {}
message Reconciliation {
  string belief_id = 1;
  double predicted = 2;
  double observed  = 3;
  double surprise  = 4;
  bool   confirmed = 5;
}
message ReconcileExpectationsResponse { repeated Reconciliation reconciliations = 1; }

// ---------------------------------------------------------------------------
// Belief writes, governance and per-belief reads
// ---------------------------------------------------------------------------

message RememberFactRequest {
  string                    text       = 1;
  repeated string           evidence   = 2;
  google.protobuf.Timestamp valid_from = 3; // unset = now
}
// belief_id is the belief that holds the fact: the new one, or the one the
// brain already held when the fact restated it (known = true; the fact's
// evidence was linked to it and no belief was written).
message RememberFactResponse {
  string belief_id = 1;
  bool   known     = 2;
}

message ScanBeliefsRequest {
  google.protobuf.Timestamp valid_from  = 1; // unset = open
  google.protobuf.Timestamp valid_until = 2; // unset = open
  int32                     limit       = 3; // 0 = the server cap
}
message ScanBeliefsResponse { repeated BeliefDetail beliefs = 1; }

message DeprecateBeliefRequest {
  string belief_id = 1;
  string reason    = 2;
}
message EscalateBeliefRequest {
  string belief_id = 1;
  string reason    = 2;
}
message BeliefStatusChange {
  string belief_id  = 1;
  string old_status = 2;
  string new_status = 3;
}

message UpdateBeliefRequest {
  string belief_id  = 1;
  string text       = 2;
  double confidence = 3; // 0 keeps the current confidence
  string reason     = 4;
}
message BeliefRevision {
  string belief_id  = 1;
  string old_text   = 2;
  string new_text   = 3;
  double confidence = 4;
}

message ResolveDissonanceRequest {
  string winner_id = 1;
  string loser_id  = 2;
  string reason    = 3;
}
message ResolveDissonanceResponse {
  string winner_id = 1;
  string loser_id  = 2;
}

message BeliefEscalation {
  string belief_id         = 1;
  string action            = 2;
  string escalation_reason = 3;
  string rationale         = 4;
}

message VerifyBeliefRequest { string belief_id = 1; }
message VerifyBeliefResponse {
  string                    belief_id   = 1;
  google.protobuf.Timestamp verified_at = 2;
}

message RecordBeliefFeedbackRequest {
  string belief_id = 1;
  bool   helpful   = 2;
  string note      = 3;
}
message BeliefFeedback {
  string belief_id                = 1;
  bool   helpful                  = 2;
  string new_status               = 3;
  double new_confidence           = 4;
  int32  negative_feedback_streak = 5;
  int32  helpful_count            = 6;
  bool   auto_contested           = 7;
}

message BeliefProvenanceRequest { string belief_id = 1; }

message BeliefHistoryRequest { string belief_id = 1; }
message BeliefVersion {
  string                    belief_id  = 1;
  int32                     version    = 2;
  string                    text       = 3;
  double                    confidence = 4;
  string                    status     = 5;
  google.protobuf.Timestamp written_at = 6;
  string                    written_by = 7;
}
message BeliefHistoryResponse {
  string                 belief_id = 1;
  repeated BeliefVersion versions  = 2;
}
