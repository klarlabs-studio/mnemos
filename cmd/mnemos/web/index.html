<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnemos Registry</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header>
  <h1>Mnemos Registry</h1>
  <nav class="nav-small">
    <a href="/" class="back-link">← Back to Home</a>
  </nav>
  <div class="meta" id="meta">loading…</div>
</header>

<section id="metrics-section">
  <h2>Knowledge base</h2>
  <div class="metrics" id="metrics"></div>
</section>

<section id="claims-section">
  <h2>Claims</h2>
  <div class="controls">
    <select id="claim-type">
      <option value="">All types</option>
      <option value="fact">Fact</option>
      <option value="hypothesis">Hypothesis</option>
      <option value="decision">Decision</option>
    </select>
    <select id="claim-status">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="contested">Contested</option>
      <option value="resolved">Resolved</option>
      <option value="deprecated">Deprecated</option>
    </select>
  </div>
  <div id="claims"></div>
  <div class="pagination" id="claims-pagination"></div>
</section>

<section id="contradictions-section">
  <h2>Contradictions</h2>
  <div id="contradictions"></div>
  <div class="pagination" id="contradictions-pagination"></div>
</section>

<script src="/assets/app.js"></script>
</body>
</html>
