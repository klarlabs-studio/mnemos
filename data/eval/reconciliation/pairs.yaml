# Reconciliation pairs (ADR 0042): is the relationship between two beliefs a
# contradiction (including one superseding the other) or are they compatible?
#
# Labels are written by hand against the rules in README.md, never by asking a
# model. `source` names where a pair was taken from; `hand` marks pairs written
# for this set (the deterministic detectors' documented blind spots, ADR 0040
# §Limitations, and their compatible counterparts). Where a pair comes from an
# older corpus whose expectation described a detector's behaviour rather than
# the meaning, the label here is the meaning and the rationale says so.
#
# The dev/test split is not stored: it is derived from the id (FNV-1a mod 10,
# 0-2 dev, 3-9 test) so it cannot be edited to suit a result.
version: 1
pairs:
  # ---------------------------------------------------------------------------
  # data/eval/relationship_detection.yaml
  # ---------------------------------------------------------------------------
  - id: rd-001
    a: The deployment succeeded in production
    b: The deployment did not succeed in production
    label: contradicts
    category: polarity
    source: relationship_detection.yaml#rel-001
    rationale: Same event and scope, asserted and denied.
  - id: rd-002
    a: The service passed all integration tests
    b: The service didn't pass all integration tests
    label: contradicts
    category: polarity
    source: relationship_detection.yaml#rel-002
    rationale: Same test run, asserted and denied.
  - id: rd-003
    a: The system never experiences downtime
    b: The system experiences downtime during deployments
    label: contradicts
    category: polarity
    source: relationship_detection.yaml#rel-003
    rationale: '"Never" excludes any downtime, including during deployments.'
  - id: rd-004
    a: The database cannot handle concurrent writes
    b: The database can handle concurrent writes efficiently
    label: contradicts
    category: polarity
    source: relationship_detection.yaml#rel-004
    rationale: Same capability asserted and denied.
  - id: rd-005
    a: Revenue increased significantly in Q2
    b: Revenue increased after the product launch in Q2
    label: compatible
    category: supports
    source: relationship_detection.yaml#rel-005
    rationale: Both say Q2 revenue rose; one adds a cause.
  - id: rd-006
    a: PostgreSQL performance improved after indexing
    b: PostgreSQL query performance improved with new indexes
    label: compatible
    category: supports
    source: relationship_detection.yaml#rel-006
    rationale: Paraphrases of one improvement.
  - id: rd-007
    a: The frontend uses React for rendering
    b: The backend uses Kafka for messaging
    label: compatible
    category: unrelated
    source: relationship_detection.yaml#rel-007
    rationale: Different components, different facts.
  - id: rd-008
    a: Revenue increased in Q2
    b: The team increased headcount
    label: compatible
    category: unrelated
    source: relationship_detection.yaml#rel-008
    rationale: Different subjects sharing a verb.
  - id: rd-009
    a: The API response time is 45ms
    b: We hired three new engineers
    label: compatible
    category: unrelated
    source: relationship_detection.yaml#rel-009
    rationale: Nothing in common.
  - id: rd-010
    a: Python is used for data science
    b: Go is used for backend services
    label: compatible
    category: unrelated
    source: relationship_detection.yaml#rel-010
    rationale: Same frame, different subjects; both can hold.
  - id: rd-011a
    a: The migration completed successfully in staging
    b: The migration completed successfully in production
    label: compatible
    category: supports
    source: relationship_detection.yaml#rel-011
    rationale: Same outcome in two environments.
  - id: rd-011b
    a: The migration completed successfully in production
    b: The migration failed in production
    label: contradicts
    category: value
    source: relationship_detection.yaml#rel-011
    rationale: Same migration and environment, opposite outcomes.
  - id: rd-011c
    a: The migration completed successfully in staging
    b: The migration failed in production
    label: compatible
    category: scope-blind
    source: relationship_detection.yaml#rel-011
    rationale: Opposite outcomes in different environments can both be true (the source file expects no edge here either).
  - id: rd-012
    a: Meeting the Q4 deadline is achievable with current resources
    b: Meeting the Q4 deadline is impossible with current resources
    label: contradicts
    category: value
    source: relationship_detection.yaml#rel-012
    rationale: Antonymous assessments of the same deadline.

