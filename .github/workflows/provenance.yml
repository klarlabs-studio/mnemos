name: Provenance

# Cancel a superseded run when a PR gets a new commit — only the latest head
# needs provenance verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Warden provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: klarlabs-studio/warden/.github/actions/warden-verify@b54f430961ac5e3be65d590a00384ba87a0d84ca # main @ 2026-10-06
        with:
          commit: ${{ github.event.pull_request.head.sha }}
