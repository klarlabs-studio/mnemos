# Thin caller for the shared klarlabs-studio Go CI bar. All core gate logic
# (format, golangci-lint w/ gocritic, race + coverage tests, coverctl gate,
# nox security scan w/ pinned+sha256 binary) lives in the reusable workflow —
# bump versions / add jobs there, once, org-wide.
#
# mnemos-specific jobs that the shared bar does NOT cover live in their own
# workflows: db-providers.yml (Postgres + MySQL), recall-gate.yml (Python
# benchmark gate), integration.yml (docker-compose smoke), release.yml
# (multi-arch docker / goreleaser / SLSA).
name: CI

# Advisory: branch protection requires warden/gate, not these checks (see
# .warden.yaml and CLAUDE.md "The merge gate is warden"). A red run on main is
# still a defect, usually a check the warden gate lacks. No paths-ignore, so
# the signal covers docs-only PRs too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@75edaf97c1274c4036460d3895dd85f9d7dbc021 # main @ 2026-10-06; this job holds security-events:write and inherited secrets, so the code it runs is pinned
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # shared security job posts nox annotations on PRs
    secrets: inherit
    with:
      # go.mod requires >= 1.26.2; setup-go pins GOTOOLCHAIN=local, so the
      # shared default (1.25) can't auto-download a newer toolchain.
      go-version: "1.26"
      # The org-pinned golangci-lint v2.7.2 release binary is built with
      # go1.25 and refuses to lint a go1.26.2 module ("build Go version is
      # lower than the targeted Go version"). v2.12.2 is built with go1.26.2.
      #
      # Raised again to v2.13.1 (built with go1.27.0): the gofmt linter uses
      # whichever gofmt golangci-lint was BUILT with, not the go-version
      # above, and go1.27's gofmt aligns struct literals differently. Source
      # formatted by anyone on go1.27 therefore failed under v2.12.2 —
      # internal/govwrite/executors.go:108 and lifecycle.go:45 — while being
      # correct. main was red on that alone from 2026-08-25. v2.13.1 reports
      # 0 issues on the same tree.
      #
      # So this pin tracks the newest Go anyone formats with, not the
      # module's own go directive.
      # TODO(org): bump the shared go-ci.yml golangci default for go1.26 repos.
      golangci-version: "v2.13.1"
      # mnemos enforces coverctl check already; pure-Go core runs fine on ubuntu.
      coverage: true
      cross-platform: false
